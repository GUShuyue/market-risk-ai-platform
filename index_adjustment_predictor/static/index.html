<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A股指数成分股调整预测系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 华泰品牌色 — 提亮、有精神 */
    --brand: #1f5fbf;          /* 主色：明亮华泰蓝 */
    --brand-600: #1a4f9e;
    --brand-700: #163f80;
    --brand-tint: #eaf1fb;     /* 极浅蓝底，用于 hover/高亮 */
    --accent: #e0243b;         /* 华泰红：仅作品牌锚点 */
    --ok: #15a06a;             /* 运行中 */
    --warn: #e8920c;

    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #f0f3f9;
    --border: #e7ebf2;
    --border-strong: #d9e0ea;
    --text: #18212f;
    --text-dim: #586478;
    --text-faint: #8a94a6;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(20,30,50,.04), 0 1px 3px rgba(20,30,50,.05);
    --shadow-md: 0 10px 30px -12px rgba(25,50,95,.18);
    --shadow-lg: 0 24px 60px -24px rgba(25,50,95,.28);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14.5px;
  }

  /* ============ 左侧栏 ============ */
  .sidebar {
    width: 264px; flex: 0 0 264px; height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 18px 14px; gap: 6px;
    position: sticky; top: 0;
  }
  .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 40px;
    background: linear-gradient(135deg, var(--brand), var(--brand-600));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 18px -6px rgba(31,95,191,.55);
  }
  .logo svg { width: 22px; height: 22px; }
  .sb-brand .nm { font-size: 14.5px; font-weight: 700; color: var(--text); line-height: 1.25; }
  .sb-brand .sb { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }

  .sb-new {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    margin: 2px 6px 12px; padding: 9px;
    background: var(--brand-tint); color: var(--brand-700);
    border: 1px solid color-mix(in srgb, var(--brand) 18%, #fff);
    border-radius: 11px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .sb-new:hover { background: color-mix(in srgb, var(--brand) 14%, #fff); box-shadow: var(--shadow-sm); }
  .sb-new svg { width: 15px; height: 15px; }

  .sb-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--text-faint); text-transform: uppercase; padding: 14px 10px 7px; }
  .sb-prompt {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 10px; border-radius: 11px; cursor: pointer;
    color: var(--text-dim); transition: background .14s ease, color .14s ease;
  }
  .sb-prompt:hover { background: var(--surface-2); color: var(--text); }
  .sb-prompt .pic { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-tint); color: var(--brand); }
  .sb-prompt .pic svg { width: 16px; height: 16px; }
  .sb-prompt .pt { font-size: 13px; font-weight: 550; line-height: 1.3; }
  .sb-prompt .pd { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

  .sb-foot { margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-faint); display: flex; align-items: center; gap: 7px; }
  .sb-foot .fd { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(224,36,59,.12); }

  /* ============ 主区 ============ */
  .main { flex: 1; min-width: 0; height: 100vh; display: flex; flex-direction: column; }
  .topbar { height: 3px; flex: 0 0 3px; background: linear-gradient(90deg, var(--brand), var(--brand-600) 60%, #6f9bd8); }

  header.bar {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 22px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    flex: 0 0 auto;
  }
  header.bar h1 { font-size: 15px; margin: 0; font-weight: 700; color: var(--text); letter-spacing: .2px; }
  header.bar .sub { font-size: 12px; color: var(--text-faint); margin-left: 2px; }
  .status-pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-dim); padding: 6px 13px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(21,160,106,.15); }

  main.chat { flex: 1; overflow-y: auto; padding: 0 18px; }
  main.chat::-webkit-scrollbar { width: 10px; }
  main.chat::-webkit-scrollbar-thumb { background: #cdd6e3; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  main.chat::-webkit-scrollbar-thumb:hover { background: #aab6c9; background-clip: content-box; }
  main.chat::-webkit-scrollbar-track { background: transparent; }
  .wrap { max-width: 820px; margin: 0 auto; }

  /* ============ 欢迎态 ============ */
  .empty { padding: 9vh 18px 48px; text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--brand-700);
    background: var(--brand-tint); border: 1px solid color-mix(in srgb, var(--brand) 16%, #fff);
    padding: 5px 13px; border-radius: 999px;
  }
  .eyebrow svg { width: 13px; height: 13px; }
  .empty h2 { font-size: 28px; font-weight: 750; letter-spacing: -.5px; color: var(--text); margin: 18px 0 10px; }
  .empty .lead { font-size: 14.5px; color: var(--text-dim); max-width: 520px; margin: 0 auto; line-height: 1.7; }
  .chips { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; margin: 28px auto 0; max-width: 680px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--text-dim);
    box-shadow: var(--shadow-sm); transition: border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand-700); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .chip svg { width: 15px; height: 15px; color: var(--brand); }

  /* ============ 消息 ============ */
  .msg { display: flex; gap: 12px; margin-bottom: 22px; align-items: flex-start; animation: msgIn .32s ease both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .bubble-col { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble-col { align-items: flex-end; }
  .avatar { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .avatar.user { background: linear-gradient(135deg, var(--brand), var(--brand-600)); color: #fff; box-shadow: 0 4px 12px -4px rgba(31,95,191,.5); }
  .avatar.bot { background: var(--surface); border: 1px solid var(--border); color: var(--brand); box-shadow: var(--shadow-sm); }
  .avatar.bot svg { width: 18px; height: 18px; }
  .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 14px 17px; max-width: 700px; line-height: 1.74; font-size: 14.5px; word-break: break-word; box-shadow: var(--shadow-sm); }
  .msg.user .bubble { background: var(--brand-tint); border-color: color-mix(in srgb, var(--brand) 22%, #fff); }
  .msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 11px; color: var(--text-faint); }
  .msg.user .msg-meta { flex-direction: row-reverse; }
  .copy-btn { display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent; cursor: pointer; color: var(--text-faint); font-size: 11px; padding: 2px 7px; border-radius: 6px; transition: color .15s ease, background .15s ease; }
  .copy-btn:hover { color: var(--brand); background: var(--brand-tint); }
  .copy-btn svg { width: 12px; height: 12px; }

  /* markdown */
  .bubble h2, .bubble h3 { margin: 14px 0 8px; line-height: 1.4; }
  .bubble h2 { font-size: 16px; border-left: 3px solid var(--brand); padding-left: 10px; color: var(--brand-700); }
  .bubble h3 { font-size: 14.5px; color: var(--brand-700); }
  .bubble p { margin: 8px 0; }
  .bubble ul { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: #0f172a; }
  .bubble code { background: var(--surface-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; font-size: 13px; color: #be185d; }
  .bubble blockquote { border-left: 3px solid var(--text-faint); margin: 8px 0; padding: 4px 12px; color: var(--text-dim); background: var(--surface-2); border-radius: 0 6px 6px 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
  .bubble th { background: var(--surface-2); }
  .bubble tr:nth-child(even) td { background: #fafbfd; }

  .report-btn { display: inline-flex; align-items: center; gap: 7px; margin-top: 13px; margin-right: 8px; padding: 9px 15px; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background .15s ease, box-shadow .15s ease; box-shadow: 0 6px 16px -6px rgba(31,95,191,.5); }
  .report-btn:hover { background: var(--brand-600); }
  .report-btn svg { width: 15px; height: 15px; }

  /* loading */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: blink 1.3s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; transform: scale(.85);} 40% { opacity:1; transform: scale(1);} }
  .loading-bar { margin-top: 8px; font-size: 12.5px; color: var(--text-dim); }
  .loading-time { margin-top: 4px; font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .err-box { display: flex; gap: 9px; align-items: flex-start; border-color: color-mix(in srgb, var(--accent) 35%, #fff) !important; background: color-mix(in srgb, var(--accent) 6%, #fff) !important; color: #b42318; }
  .err-box svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 2px; }

  /* ============ 输入区 ============ */
  footer { flex: 0 0 auto; padding: 14px 18px 16px; border-top: 1px solid var(--border); background: rgba(255,255,255,.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .composer { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-md); padding: 8px 8px 8px 16px; display: flex; align-items: flex-end; gap: 10px; transition: border-color .18s ease, box-shadow .18s ease; }
  .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,95,191,.10), var(--shadow-md); }
  .composer textarea { flex: 1; border: none; outline: none; resize: none; background: transparent; font-family: inherit; font-size: 14.5px; color: var(--text); padding: 10px 0; min-height: 24px; max-height: 150px; line-height: 1.55; }
  .composer textarea::placeholder { color: #9aa4b2; }
  button.send { width: 40px; height: 40px; flex: 0 0 40px; border: none; border-radius: 11px; background: linear-gradient(135deg, var(--brand), var(--brand-600)); color: #fff; cursor: pointer; display: grid; place-items: center; transition: filter .15s ease, box-shadow .15s ease; box-shadow: 0 6px 16px -5px rgba(31,95,191,.55); }
  button.send:hover:not(:disabled) { filter: brightness(1.06); }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  button.send svg { width: 19px; height: 19px; }
  .hint { max-width: 820px; margin: 9px auto 0; font-size: 11.5px; color: #9aa4b2; text-align: center; }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .empty { padding-top: 6vh; }
  }
</style>
</head>
<body>
  <!-- 左侧栏 -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
      </div>
      <div>
        <div class="nm">指数成分股预测</div>
        <div class="sb">沪深300 · 量化 + LLM</div>
      </div>
    </div>

    <div class="sb-new" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </div>

    <div class="sb-label">快捷指令</div>
    <div class="sb-prompt" data-q="预测2025年6月沪深300的调整">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></span>
      <span><span class="pt">预测调整</span><br><span class="pd">2025年6月沪深300</span></span>
    </div>
    <div class="sb-prompt" data-q="纯量化预测2025年6月沪深300的调整">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/></svg></span>
      <span><span class="pt">纯量化预测</span><br><span class="pd">可解释、不依赖模型</span></span>
    </div>
    <div class="sb-prompt" data-q="回测2025年6月沪深300">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></span>
      <span><span class="pt">回测验证</span><br><span class="pd">2025年6月沪深300</span></span>
    </div>
    <div class="sb-prompt" data-q="查看沪深300的编制规则">
      <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <span><span class="pt">查询规则</span><br><span class="pd">沪深300 编制规则</span></span>
    </div>

    <div class="sb-foot"><span class="fd"></span>华泰证券 · 风险管理部</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar"></div>
    <header class="bar">
      <h1>A股指数成分股调整预测</h1>
      <span class="sub">自然语言驱动</span>
      <div class="status-pill"><span class="dot" id="dot"></span><span id="conn">服务就绪</span></div>
    </header>

    <main class="chat">
      <div class="wrap" id="chat">
        <div class="empty" id="welcome">
          <span class="eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.4 2.3 7.2L12 17l-6.3 4 2.3-7.2-6-4.4h7.6z"/></svg>
            AI 市场风险管理
          </span>
          <h2>预测指数成分股调整</h2>
          <p class="lead">用一句话发起预测、回测与规则查询。从左侧选择常用指令，或直接在下方输入需求。</p>
          <div class="chips">
            <button class="chip" data-q="预测2025年6月沪深300的调整">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
              预测调整
            </button>
            <button class="chip" data-q="回测2025年6月沪深300">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
              回测验证
            </button>
            <button class="chip" data-q="查看沪深300的编制规则">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              查询规则
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入需求，例如：预测2025年6月沪深300的调整（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send" title="发送" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="hint">预测 / 回测涉及数据采集与大模型分析，单次约需 1–3 分钟，请耐心等待</div>
    </footer>
  </div>

<script>
const API = '/api/chat/';
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');

const ICONS = {
  bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 10h.01M12 10h4M8 14h8"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
};
function nowTime(){ return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }

/* ---------- 极简 Markdown 渲染 ---------- */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function renderMarkdown(md){
  const lines = md.split(/\r?\n/);
  let html = '', listOpen = false, tableRows = [];
  const closeList = () => { if(listOpen){ html += '</ul>'; listOpen=false; } };
  const flushTable = () => {
    if(!tableRows.length) return;
    html += '<table>';
    tableRows.forEach((row, i) => {
      const raw = row.replace(/^\|/,'').replace(/\|$/,'').split('|');
      html += '<tr>';
      raw.forEach(c => html += i===0 ? `<th>${inline(c.trim())}</th>` : `<td>${inline(c.trim())}</td>`);
      html += '</tr>';
    });
    html += '</table>'; tableRows = [];
  };
  for(let raw of lines){
    const line = raw.trimEnd();
    if(/^\s*$/.test(line)){ closeList(); flushTable(); continue; }
    if(/^\|.*\|/.test(line) && line.split('|').length >= 3){ closeList(); tableRows.push(line.trim()); continue; }
    flushTable();
    let m;
    if(m = line.match(/^###\s+(.*)/)){ closeList(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if(m = line.match(/^##\s+(.*)/)){ closeList(); html += `<h2>${inline(m[1])}</h2>`; continue; }
    if(m = line.match(/^#\s+(.*)/)){ closeList(); html += `<h2>${inline(m[1])}</h2>`; continue; }
    if(m = line.match(/^>\s?(.*)/)){ closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if(m = line.match(/^[-*]\s+(.*)/)){ if(!listOpen){ html += '<ul>'; listOpen=true; } html += `<li>${inline(m[1])}</li>`; continue; }
    closeList(); html += `<p>${inline(line)}</p>`;
  }
  closeList(); flushTable();
  return html;
}

/* ---------- 对话渲染 ---------- */
function addUser(text){
  if(welcome) welcome.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="avatar user">我</div><div class="bubble-col"><div class="bubble"></div><div class="msg-meta"><span>我</span><span>·</span><span>${nowTime()}</span></div></div>`;
  el.querySelector('.bubble').textContent = text;
  chat.appendChild(el); scrollBottom();
}
function addBotLoading(){
  const el = document.createElement('div');
  el.className = 'msg bot'; el.id = 'loading-msg';
  const startTime = Date.now();
  el.innerHTML =
    `<div class="avatar bot">${ICONS.bot}</div>
     <div class="bubble-col">
       <div class="bubble">
         <div class="typing"><span></span><span></span><span></span></div>
         <div class="loading-bar">正在分析中，请稍候…</div>
         <div class="loading-time"></div>
       </div>
     </div>`;
  chat.appendChild(el); scrollBottom();
  el._timer = setInterval(()=>{
    const e = Math.floor((Date.now()-startTime)/1000), m = Math.floor(e/60), s = e%60;
    const t = el.querySelector('.loading-time');
    if(t) t.textContent = m>0 ? `已用时 ${m}分${s}秒` : `已用时 ${s}秒`;
  }, 1000);
  return el;
}
function addBotResult(reply, reportUrl, analysisReportUrl){
  const el = document.createElement('div');
  el.className = 'msg bot';
  let extra = '';
  if(reportUrl) extra += `<a class="report-btn" href="${reportUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>查看可视化报告</a>`;
  if(analysisReportUrl) extra += `<a class="report-btn" href="${analysisReportUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>查看分析报告</a>`;
  el.innerHTML =
    `<div class="avatar bot">${ICONS.bot}</div>
     <div class="bubble-col">
       <div class="bubble">${renderMarkdown(reply)}${extra}</div>
       <div class="msg-meta"><span>AI 助手</span><span>·</span><span>${nowTime()}</span>
         <button class="copy-btn" type="button">${ICONS.copy}<span>复制</span></button>
       </div>
     </div>`;
  el.querySelector('.copy-btn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget, label = btn.querySelector('span');
    try { await navigator.clipboard.writeText(el.querySelector('.bubble').innerText); label.textContent='已复制'; setTimeout(()=>label.textContent='复制',1500); } catch(_){}
  });
  chat.appendChild(el); scrollBottom();
}
function addError(msg){
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML =
    `<div class="avatar bot">${ICONS.bot}</div>
     <div class="bubble-col">
       <div class="bubble err-box">${ICONS.warn}<span>${escapeHtml(msg)}</span></div>
       <div class="msg-meta"><span>系统</span><span>·</span><span>${nowTime()}</span></div>
     </div>`;
  chat.appendChild(el); scrollBottom();
}
function clearChat(){
  chat.querySelectorAll('.msg').forEach(m => m.remove());
  if(welcome) welcome.style.display = '';
  input.focus();
}
function scrollBottom(){ const m = document.querySelector('main.chat'); m.scrollTop = m.scrollHeight; }

/* ---------- 交互 ---------- */
let busy = false;
async function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true; input.value=''; autoResize();
  addUser(text);
  const loadingEl = addBotLoading();
  const controller = new AbortController();
  const timeout = setTimeout(()=> controller.abort(), 1000*60*30);
  try{
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text }), signal: controller.signal });
    clearTimeout(timeout); clearInterval(loadingEl._timer); loadingEl.remove();
    if(!res.ok){
      let detail = `请求失败 (HTTP ${res.status})`;
      try { const j = await res.json(); if(j.detail) detail = j.detail; } catch(_){}
      addError(detail);
    } else {
      const data = await res.json();
      addBotResult(data.reply || '(无回复)', data.report_html_url || '', data.analysis_report_html_url || '');
    }
  } catch(err){
    clearTimeout(timeout); clearInterval(loadingEl._timer); loadingEl.remove();
    if(err.name === 'AbortError') addError('请求超时（超过30分钟），请重试或拆分任务。');
    else addError('无法连接服务，请联系 IT 运维确认后端已启动后重试。');
  } finally { busy=false; sendBtn.disabled=false; input.focus(); }
}
function autoResize(){ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px'; }
sendBtn.addEventListener('click', send);
input.addEventListener('input', autoResize);
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
document.querySelectorAll('.sb-prompt, .chip').forEach(b => b.addEventListener('click', ()=>{ input.value = b.dataset.q; autoResize(); send(); }));
document.getElementById('newChat').addEventListener('click', clearChat);

fetch('/health').then(r => { if(!r.ok) throw new Error(); document.getElementById('conn').textContent='服务就绪'; })
  .catch(()=>{ document.getElementById('conn').textContent='服务未响应'; document.getElementById('dot').style.background='var(--text-faint)'; document.getElementById('dot').style.boxShadow='none'; });
input.focus();
</script>
