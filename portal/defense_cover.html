<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑期实习答辩 · 谷舒悦</title>
<style>
  :root {
    --ht-navy: #1a3766;
    --ht-red: #c8102e;
    --ht-red-soft: #e15a5a;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8a8a;
    --line: #e6e8ec;
    --bg: #fafbfc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans SC", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cover {
    position: relative;
    width: min(960px, 90vw);
    text-align: center;
  }

  /* 左上角 Logo */
  .brand {
    position: absolute;
    top: 48px;
    left: 64px;
    animation: fadeIn 1s cubic-bezier(.22,.9,.3,1) both;
  }
  .brand img {
    height: 84px;
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 主标题 */
  h1 {
    font-size: clamp(46px, 6.6vw, 76px);
    font-weight: 700;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--ht-navy);
    line-height: 1.1;
    animation: fadeIn 1s .22s cubic-bezier(.22,.9,.3,1) both;
  }

  .subtitle {
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--ink-3);
    text-transform: uppercase;
    animation: fadeIn 1s .3s cubic-bezier(.22,.9,.3,1) both;
  }

  /* 分隔线 */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 48px auto 40px;
    animation: fadeIn 1s .38s cubic-bezier(.22,.9,.3,1) both;
  }
  .divider .line { width: 100px; height: 1px; background: var(--line); }
  .divider .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ht-red); }

  /* 姓名 */
  .name-line {
    font-size: clamp(32px, 4.4vw, 46px);
    font-weight: 600;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--ink);
    animation: fadeIn 1s .46s cubic-bezier(.22,.9,.3,1) both;
  }
  .name-line .post {
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-3);
    letter-spacing: 3px;
    text-indent: 3px;
    margin-left: 10px;
  }

  /* 信息行 */
  .meta {
    display: flex;
    justify-content: center;
    gap: 56px;
    margin-top: 44px;
    animation: fadeIn 1s .54s cubic-bezier(.22,.9,.3,1) both;
  }
  .meta .item { text-align: center; }
  .meta .k {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-3);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .meta .v {
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 1px;
  }

  @media (max-width: 720px) {
    h1 { letter-spacing: 4px; text-indent: 4px; }
    .name-line { letter-spacing: 5px; text-indent: 5px; }
    .meta { gap: 28px; }
    .brand { top: 28px; left: 28px; }
    .brand img { height: 56px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <img src="assets/htsc_logo.png" alt="华泰证券 HUATAI SECURITIES">
    </div>

    <div class="cover">
      <h1>暑期实习答辩</h1>
      <div class="subtitle">Summer Internship Defense · 2026</div>

      <div class="divider">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <div class="name-line">谷舒悦</div>

      <div class="meta">
        <div class="item">
          <div class="k">部门</div>
          <div class="v">风险管理部</div>
        </div>
        <div class="item">
          <div class="k">岗位</div>
          <div class="v">AI 市场风险管理</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
